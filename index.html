<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Indian Food Scanner - YOLOv8 + MiDaS</title>
<!-- ONNX Runtime for Browser Inference -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #000; --paper: #fff; --muted: #5c5c5c; --line: #d6d6d6; --leaf: #2f8f46; --sky: #2a6fdb;
    --font: "Archivo", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f2f2f2; --paper: #121212; --muted: #a6a6a6; --line: #3a3a3a; --leaf: #5cc276; }
  }
  * { box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font); margin: 0; padding: 0; }
  .app { display: flex; flex-direction: column; height: 100vh; max-width: 560px; margin: 0 auto; }
  main { flex: 1; overflow-y: auto; padding: 12px; }
  
  nav.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 2px solid var(--ink); }
  nav.tabs button { background: var(--paper); border: none; padding: 14px 0; font-weight: 800; font-size: 15px; color: var(--muted); }
  nav.tabs button[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 4px 0 var(--ink); }
  
  .btn { border: 2px solid var(--ink); background: var(--paper); color: var(--ink); padding: 10px; font-weight: 800; width: 100%; cursor: pointer; }
  .btn.primary { background: var(--ink); color: var(--paper); }
  
  /* Scanner UI */
  .viewport { position: relative; width: 100%; aspect-ratio: 3/4; background: #000; overflow: hidden; margin-bottom: 12px; border: 2px solid var(--ink); }
  .viewport video, .viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #depthOverlay { opacity: 0.6; mix-blend-mode: screen; }
  
  .scan-panel { border: 2px solid var(--ink); padding: 12px; margin-top: 12px; }
  .scan-panel h3 { margin: 0 0 8px 0; }
  .metric { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 6px 0; font-variant-numeric: tabular-nums; }
  .metric:last-child { border-bottom: none; }
  .metric b { color: var(--leaf); }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
<main>
  <!-- SCANNER TAB -->
  <section id="tab-scan">
    <div class="viewport">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="depthOverlay"></canvas>
      <canvas id="bboxOverlay"></canvas>
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <button class="btn primary" id="startCam">Start Camera</button>
      <button class="btn" id="toggleDepth">Show Depth Map</button>
    </div>

    <div class="scan-panel" id="detectionResults">
      <h3>AI Analysis (YOLOv8 + MiDaS)</h3>
      <div class="metric"><span>Detected Food:</span> <b id="detName">--</b></div>
      <div class="metric"><span>Density (\(\rho\)):</span> <b id="detDensity">-- g/cm³</b></div>
      <div class="metric"><span>Est. Volume (\(V\)):</span> <b id="detVolume">-- cm³</b></div>
      <div class="metric" style="border-top: 2px solid var(--ink); padding-top: 8px;">
        <span>Calculated Weight:</span> <b id="detWeight">-- g</b>
      </div>
      <div class="metric"><span>Total Calories:</span> <b id="detKcal">-- kcal</b></div>
      <button class="btn primary" id="logFoodBtn" style="margin-top: 12px;" disabled>Log this meal</button>
    </div>
    <p style="font-size: 12px; color: var(--muted); margin-top: 12px;">
      *Volume derived from MiDaS pseudo-depth \((Z)\) and YOLO area. Dataset: Indian_Food_Nutrition_Processed.csv.
    </p>
  </section>
</main>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="scan" aria-selected="true">Scan & Weigh</button>
  <button role="tab" data-tab="today" aria-selected="false">Today's Log</button>
  <button role="tab" data-tab="database" aria-selected="false">CSV Database</button>
</nav>
</div>

<script>
// =====================================================================
// 1. DATASET: Indian_Food_Nutrition_Processed.csv
// Adapted to match typical processed nutrition datasets (Dish Name, Calories, etc.)
// =====================================================================
const csvData = `Dish Name,Diet,Calories_100g,Protein_100g,Carbs_100g,Fat_100g,Density_g_cm3
Idli,Vegetarian,140,4.5,29,0.4,0.65
Masala Dosa,Vegetarian,190,4.0,28,7.0,0.80
Chicken Biryani,Non-Vegetarian,175,9.0,21,6.0,0.95
Palak Paneer,Vegetarian,165,8.0,6,12.0,1.10
Samosa,Vegetarian,290,5.0,30,17.0,0.75
Gulab Jamun,Vegetarian,330,4.0,50,12.0,1.20
Dal Makhani,Vegetarian,165,6.0,15,9.0,1.05`;

function parseCSV(csv) {
    const lines = csv.split('\n').filter(l => l.trim());
    const headers = lines[0].split(',');
    return lines.slice(1).map(line => {
        const values = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g).map(v => v.replace(/"/g, ''));
        let obj = {};
        headers.forEach((h, i) => obj[h.trim()] = values[i]);
        return obj;
    });
}
const PROCESSED_DB = parseCSV(csvData);

// =====================================================================
// 2. ONNX RUNTIME INFERENCE & CAMERA PIPELINE
// =====================================================================
let camOn = false;
let yoloSession, midasSession;
let useSimulation = true; // Set to false if serving yolov8n.onnx and midas.onnx locally

const video = document.getElementById('video');
const bboxCanvas = document.getElementById('bboxOverlay');
const depthCanvas = document.getElementById('depthOverlay');

async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        camOn = true;
        
        video.onloadedmetadata = () => {
            bboxCanvas.width = video.videoWidth; bboxCanvas.height = video.videoHeight;
            depthCanvas.width = video.videoWidth; depthCanvas.height = video.videoHeight;
        };
        
        if (useSimulation) {
            console.log("Running simulation mode (ONNX model weights require local hosting).");
            requestAnimationFrame(simulateInferenceLoop);
        } else {
            await loadModels();
            requestAnimationFrame(inferenceLoop);
        }
    } catch (e) { alert("Camera access denied."); }
}

async function loadModels() {
    ort.env.wasm.numThreads = 1;
    yoloSession = await ort.InferenceSession.create('yolov8n.onnx', { executionProviders: ['wasm'] });
    midasSession = await ort.InferenceSession.create('midas.onnx', { executionProviders: ['wasm'] });
}

// =====================================================================
// 3. MATHEMATICAL PIPELINE: MiDaS Depth -> Volume -> Weight
// =====================================================================
const CAMERA_FOCAL_LENGTH = 800; // Intrinsic focal length
const MIDAS_CALIBRATION_SCALAR = 0.05; 

function calculateFoodProperties(boxWidth, boxHeight, medianRelativeDepth, foodItem) {
    // 1. Z-Distance from camera (avoid div by zero)
    const Z = 1 / (medianRelativeDepth * MIDAS_CALIBRATION_SCALAR + 0.001); 

    // 2. Project 2D bounding box to real-world cm
    const realWidth_cm = (boxWidth * Z) / CAMERA_FOCAL_LENGTH;
    const realHeight_cm = (boxHeight * Z) / CAMERA_FOCAL_LENGTH;

    // 3. Extrapolate 3D thickness (Assume ~70% of shortest side)
    const realThickness_cm = Math.min(realWidth_cm, realHeight_cm) * 0.7;

    // 4. Volume (cm³)
    const volume = realWidth_cm * realHeight_cm * realThickness_cm;

    // 5. Weight (g) = Volume * Density
    const density = parseFloat(foodItem.Density_g_cm3);
    const weight = volume * density;

    // 6. Total Calories
    const kcal100 = parseFloat(foodItem.Calories_100g);
    const totalKcal = (weight / 100) * kcal100;

    return { volume, weight, totalKcal };
}

// =====================================================================
// 4. INFERENCE EXECUTION
// =====================================================================
function simulateInferenceLoop() {
    if(!camOn) return;
    const ctx = bboxCanvas.getContext('2d');
    ctx.clearRect(0, 0, bboxCanvas.width, bboxCanvas.height);

    // Simulate finding "Chicken Biryani" from the Processed CSV
    const box = { x: bboxCanvas.width/4, y: bboxCanvas.height/4, w: 250, h: 180 };
    
    // Draw YOLO Bounding Box
    ctx.strokeStyle = "var(--sky)"; ctx.lineWidth = 4;
    ctx.strokeRect(box.x, box.y, box.w, box.h);
    ctx.fillStyle = "var(--sky)"; ctx.font = "bold 20px Archivo";
    ctx.fillText("Chicken Biryani 88%", box.x, box.y - 10);

    // Simulate MiDaS Median Depth
    const medianDepth = 105; 
    
    // Run mathematical pipeline targeting the Processed CSV data
    const foodItem = PROCESSED_DB.find(f => f['Dish Name'] === "Chicken Biryani");
    const metrics = calculateFoodProperties(box.w, box.h, medianDepth, foodItem);

    // Update UI
    document.getElementById('detName').textContent = foodItem['Dish Name'];
    document.getElementById('detDensity').textContent = foodItem.Density_g_cm3 + " g/cm³";
    document.getElementById('detVolume').textContent = metrics.volume.toFixed(1) + " cm³";
    document.getElementById('detWeight').textContent = metrics.weight.toFixed(1) + " g";
    document.getElementById('detKcal').textContent = metrics.totalKcal.toFixed(0) + " kcal";
    document.getElementById('logFoodBtn').disabled = false;

    setTimeout(() => requestAnimationFrame(simulateInferenceLoop), 500);
}

// Real ONNX pipeline placeholder
async function inferenceLoop() {
    if(!camOn) return;
    // await yoloSession.run({ images: tensor });
    // await midasSession.run({ input: depthTensor });
    requestAnimationFrame(inferenceLoop);
}

document.getElementById('startCam').onclick = startCamera;
document.getElementById('toggleDepth').onclick = () => {
    depthCanvas.hidden = !depthCanvas.hidden;
};
</script>
</body>
</html>
